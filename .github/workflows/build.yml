
name: Build VacancyFind

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build Windows x64
        run: >
          python -m PyInstaller --noconfirm --clean
          --onefile --windowed --name VacancyFind vacancy.py
      - uses: actions/upload-artifact@v4
        with:
          name: VacancyFind-Windows-x64
          path: dist/VacancyFind.exe

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build Apple Silicon app
        run: |
          python -c "import platform; print(platform.machine())"
          python -m PyInstaller --noconfirm --clean --windowed --name VacancyFind vacancy.py
      - name: Package app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            VacancyFind.app VacancyFind-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VacancyFind-macOS-arm64
          path: dist/VacancyFind-macOS-arm64.zip

  build-macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build Intel Mac app
        run: |
          python -c "import platform; print(platform.machine())"
          python -m PyInstaller --noconfirm --clean --windowed --name VacancyFind vacancy.py
      - name: Package app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            VacancyFind.app VacancyFind-macOS-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VacancyFind-macOS-x64
          path: dist/VacancyFind-macOS-x64.zip
